
name: Build WF

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main #means whenever there is PR raises from the branch which is created from main branch, trigger happens
      - feature

  schedule:
    - cron: "0 2 * * *" #nightly run at 2 AM UTC

env:
  ECR_REPOSITORY: 'vprofile-appimage'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Maven Build
        run: mvn install
      
      - name: Upload Build Artifact (WAR/JAR)
        uses: actions/upload-artifact@v4
        with: 
          name: vprofile-app
          path: target/*.war

      - name: Notify if Build Fails
        if: failure()
        run: echo "Build Job Failed !! Please Check Logs !!"

  testing:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle
      
      - name: Run tests on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "Skipping unit tests and code analysis"

  security_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: 1
          vuln-type: os, library
          output: trivy-results.json
      
      - name:  upload trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results 
          path: trivy-results.json